<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>AliCakes Confeitaria Artesanal</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700;800&family=Parisienne&display=swap"><style id="css">
/* ==========================================================================
   PARTE 2 — ESTILOS
   ========================================================================== */

/* ---------- 2.1 Cores e fontes (tema claro) ----------
   Para mudar a identidade visual, altere principalmente --accent (cor dos
   botões e títulos), --rose (detalhes), --blush (fundos suaves) e --bg (fundo). */
:root{
  --bg:#fff6f8;          /* fundo da página */
  --surface:#ffffff;     /* fundo de cards, barra superior e painéis */
  --ink:#4b2d3a;         /* cor do texto */
  --muted:#85626f;       /* texto secundário */
  --line:#f4d3de;        /* bordas finas */
  --blush:#fde7ee;       /* rosa bem claro (fundo das imagens, hover) */
  --rose:#e0799c;        /* rosa de detalhe (ícones, contador) */
  --accent:#b83f69;      /* rosa forte: botões, títulos, preços */
  --accent-ink:#ffffff;  /* cor do texto sobre o --accent */
  --champ:#c9a46a;       /* dourado champanhe: ornamentos pequenos */
  --badge-bg:#fff0d4;    /* selo de edição especial (fundo) */
  --badge-ink:#7d5410;   /* selo de edição especial (texto) */
  --danger:#b3261e;      /* botão de excluir */
  --ok:#2f7a4f;
  --f-brand:'Parisienne','Snell Roundhand',cursive;                       /* nome da marca */
  --f-head:'Cormorant Garamond',Georgia,'Times New Roman',serif;          /* títulos */
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;        /* texto */
}

/* ---------- 2.2 Tema escuro ----------
   Aplicado automaticamente quando o aparelho do cliente está no modo escuro.
   Repete as mesmas variáveis com valores escuros. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241519; --surface:#301c22; --ink:#fbe8ef; --muted:#c9a3b1; --line:#4b2c37; --blush:#3d2530;
    --rose:#f08fb0; --accent:#f08fb0; --accent-ink:#3a1020; --champ:#d9b980;
    --badge-bg:#4a3820; --badge-ink:#f2d9a6; --danger:#ff9a93; --ok:#8fd4aa;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241519; --surface:#301c22; --ink:#fbe8ef; --muted:#c9a3b1; --line:#4b2c37; --blush:#3d2530;
  --rose:#f08fb0; --accent:#f08fb0; --accent-ink:#3a1020; --champ:#d9b980;
  --badge-bg:#4a3820; --badge-ink:#f2d9a6; --danger:#ff9a93; --ok:#8fd4aa;
  color-scheme:dark;
}

/* ---------- 2.3 Base (vale para a página inteira) ---------- */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
/* Faixa no topo do celular (área do relógio/bateria) pintada com a cor da barra */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}   /* anel de foco para navegação por teclado */
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* ---------- 2.4 Barra superior (appbar) ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
/* Borda "de glacê": semicírculos repetidos logo abaixo da barra */
.appbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:11px;pointer-events:none;
  background:radial-gradient(circle at 10px 0,var(--surface) 9.5px,transparent 10.5px) 0 0/20px 11px repeat-x}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--accent)}
.brand b{font:400 2.1rem/1 var(--f-brand)}                    /* nome em letra cursiva */
.brand span{font:600 .7rem/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:6px}
.tab{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.95rem;border:1px solid transparent}
.tab:hover{background:var(--blush)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}   /* aba selecionada */
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--rose);color:#fff;font-size:.75rem;font-weight:700}
.tab[aria-current="page"] .count{background:var(--accent-ink);color:var(--accent)}
/* No celular as abas ocupam a linha toda, divididas por igual */
@media (max-width:520px){
  .tabs{width:100%}
  .tab{flex:1;justify-content:center;padding:8px 8px}
}

/* ---------- 2.5 Conteúdo geral das telas ---------- */
.main{padding-top:34px;padding-bottom:56px;display:flex;flex-direction:column;gap:28px}
.intro{display:flex;flex-direction:column;gap:8px}                      /* título + frase no topo de cada tela */
.intro h1{font-size:clamp(2.2rem,7vw,3.4rem);color:var(--accent);font-style:italic;font-weight:500}
.intro p{max-width:56ch;color:var(--muted)}
.orn{display:flex;align-items:center;gap:10px;color:var(--champ);margin-top:6px}   /* ornamento dourado (traço, losango, traço) */
.orn::before,.orn::after{content:"";height:1px;width:48px;background:currentColor;opacity:.7}
.orn i{width:7px;height:7px;transform:rotate(45deg);background:currentColor}
.notice{background:var(--blush);border:1px solid var(--line);border-radius:16px;padding:12px 16px}   /* avisos */
.notice.warn{border-color:var(--rose)}

/* ---------- 2.6 Vitrine: filtros e cards de produto ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}                              /* botões de categoria */
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.chip:hover{border-color:var(--rose)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec{display:flex;flex-direction:column;gap:14px}                        /* uma seção = título da categoria + grade */
.sec>h2{font-size:1.9rem;display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font:600 .75rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--champ)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px}   /* colunas se ajustam à largura */
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.media{position:relative;aspect-ratio:4/3;max-width:100%;background:radial-gradient(circle at 30% 25%,var(--blush),var(--bg) 75%);display:grid;place-items:center;color:var(--rose);overflow:hidden;min-height:0}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}        /* foto do produto */
.ico{width:46%;max-width:110px;display:block}                            /* ícone desenhado (quando não há foto) */
.ico svg{width:100%;height:auto;display:block}
.badge{position:absolute;top:12px;left:12px;background:var(--badge-bg);color:var(--badge-ink);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
.pbody{display:flex;flex-direction:column;gap:8px;padding:16px;flex:1;min-width:0}
.pbody h3{font-size:1.4rem}
.desc{color:var(--muted);font-size:.92rem;flex:1}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.price{font:600 1.35rem var(--f-head);font-variant-numeric:tabular-nums;color:var(--accent)}

/* ---------- 2.7 Botões, contador de quantidade e campos de formulário ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:999px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}                   /* botão só com contorno */
.btn.sm{padding:6px 14px;min-height:36px;font-size:.9rem}               /* botão pequeno */
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger.armed{background:var(--danger);color:var(--surface)}         /* "Confirmar exclusão" */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}   /* − 1 + */
.stepper button{width:36px;height:36px;border:0;background:transparent;font-size:1.15rem;cursor:pointer;border-radius:999px;color:var(--accent);font-weight:700}
.stepper button:hover{background:var(--blush)}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}   /* bloco de formulário */
.panel>h2{font-size:1.6rem;color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-weight:700;font-size:.88rem}
.field small{color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:84px}
.radios{display:flex;gap:10px;flex-wrap:wrap}                            /* Retirada / Entrega */
.radios label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.radios input{accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{accent-color:var(--accent);width:18px;height:18px}

/* ---------- 2.8 Tela de agendamento ---------- */
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}   /* linha do pedido */
.item:first-child{border-top:0}
.item .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .sub{color:var(--muted);font-size:.88rem}
.item .lt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:14px;font-family:var(--f-head);font-size:1.5rem;font-weight:600}
.total span:last-child{color:var(--accent);font-variant-numeric:tabular-nums}
.errs{border:1px solid var(--danger);color:var(--danger);border-radius:14px;padding:10px 16px;font-weight:600}   /* erros de validação */
.errs ul{margin:0;padding-left:18px}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px 22px}      /* "pedido vazio" */
.empty h2{font-size:1.8rem}
.empty .ico{width:80px;color:var(--rose)}
.summary{display:grid;grid-template-columns:auto 1fr;gap:8px 16px}      /* resumo na etapa de revisão */
.summary dt{color:var(--muted);font-weight:700}
.summary dd{margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem}

/* ---------- 2.9 Painel da confeiteira ---------- */
.arow{border:1px solid var(--line);border-radius:18px;background:var(--bg);overflow:hidden}      /* uma linha de produto */
.arow-head{display:flex;align-items:center;gap:12px;padding:10px 12px}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--blush);display:grid;place-items:center;color:var(--rose);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ico{width:30px}
.ainfo{display:flex;flex-direction:column;min-width:0;flex:1}
.ainfo strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.aedit{border-top:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}   /* formulário de edição do produto */
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;background:var(--blush);color:var(--muted)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--rose);   /* barra "Salvar e publicar" fixa embaixo */
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar p{font-weight:600;min-width:0}

/* ---------- 2.10 Rodapé e extras ---------- */
.foot{border-top:1px solid var(--line);padding-top:22px;padding-bottom:32px;color:var(--muted);font-size:.9rem;text-align:center}
.foot b{font:400 1.6rem var(--f-brand);color:var(--accent);display:block}
/* Animação leve ao passar o mouse nos cards (desligada para quem prefere sem movimento) */
@media (prefers-reduced-motion:no-preference){
  .pcard{transition:transform .2s ease,border-color .2s ease}
  .pcard:hover{transform:translateY(-3px);border-color:var(--rose)}
}

/* ---------- 2.11 Novidades desta versão: calculadora de fatias e pacotes de brigadeiro ---------- */
.sec>.cake{gap:20px}
.cake-photo{aspect-ratio:16/6;max-width:100%;border-radius:16px;overflow:hidden;position:relative;background:var(--blush)}
.cake-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cake-head{display:flex;gap:16px;align-items:center}
.cake-head .ico{width:64px;max-width:64px;flex:none;color:var(--rose)}
.cake-head h2{font-size:1.9rem;color:var(--accent)}
.cake-head p{max-width:60ch}
.cake-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
@media (max-width:780px){.cake-grid{grid-template-columns:minmax(0,1fr)}}
.cake-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.cake-col>h3{font-size:1.35rem}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:8px}
.tier{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 12px;cursor:pointer;min-width:0}
.tier:hover{border-color:var(--rose)}
.tier b{font:600 1.05rem var(--f-head)}
.tier span{color:var(--accent);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.tier[aria-pressed="true"]{border-color:var(--accent);background:var(--blush);box-shadow:inset 0 0 0 1px var(--accent)}
.result{display:flex;flex-direction:column;gap:8px;background:var(--blush);border:1px solid var(--line);border-radius:18px;padding:16px}
.result .rlabel{font-weight:700}
.result .big{font:600 2.3rem/1 var(--f-head);color:var(--accent);font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-top:4px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:.88rem}
.opt span{color:var(--muted);font-weight:600}
.opt b{font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.field .lbl{display:block}
.optlist{display:flex;flex-direction:column;gap:8px}
.optlist label{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;background:var(--bg)}
.optlist label:has(input:checked){border-color:var(--accent);background:var(--blush)}
.optlist .ol{display:flex;align-items:center;gap:10px;font-weight:600}
.optlist input{accent-color:var(--accent)}
.optlist b{color:var(--accent);font-variant-numeric:tabular-nums}
.flavors{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:6px 12px}
.flavors .check{font-weight:600;font-size:.92rem;min-width:0}
.pill.novo{background:var(--badge-bg);color:var(--badge-ink)}
.pre{white-space:pre-line}
.qty{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.qty .lt{font-weight:700;font-variant-numeric:tabular-nums}
.rowsed{display:flex;flex-direction:column;gap:10px}
.redit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:520px){.redit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.redit .btn{grid-column:1/-1;justify-self:start}}
.pcard .hint:empty,.cake .hint:empty{display:none}
.ifood{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.ifood p{font-weight:600;min-width:0}
.btn .ic{display:inline-flex;width:20px;height:20px;flex:none}
.btn .ic svg{width:100%;height:100%;display:block}

/* h('div',{class:'x'},filhos...) cria um elemento HTML.
   Propriedades: class, html (conteúdo HTML confiável), onclick/oninput... (eventos),
   value, checked e qualquer atributo comum. Textos são inseridos como texto puro,
   o que impede que um nome de produto estrague a página. */
function h(tag,props){
  var el=document.createElement(tag);
  var p=props||{};
  Object.keys(p).forEach(function(k){
    var v=p[k];
    if(v==null||v===false) return;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.indexOf('on')===0) el.addEventListener(k.slice(2),v);
    else if(k==='value') el.value=v;
    else if(k==='checked') el.checked=true;
    else el.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    kids.forEach(function(c){
      if(c==null||c===false) return;
      el.append(c.nodeType?c:document.createTextNode(String(c)));
    });
  }
  return el;
}

var fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function money(n){return fmt.format(Number(n)||0);}                       // 3.5 -> "R$ 3,50"

/* Converte o que a dona digitou ("12,50" ou "12.50") em número */
function parsePrice(s){
  s=String(s).trim().replace(/[^\d,.]/g,'');
  if(s.indexOf(',')>-1) s=s.replace(/\./g,'').replace(',','.');
  var n=parseFloat(s);
  return isFinite(n)&&n>=0?Math.round(n*100)/100:0;
}
function priceText(n){return String(n).replace('.',',');}                // 3.5 -> "3,5" (para o campo de edição)

/* "1 fatia" / "2 fatias" */
function pl(n,um,varios){return n+' '+(n===1?um:varios);}

/* Só aceita fotos no formato esperado (proteção contra dados estranhos) */
function safeImg(s){return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s||'')?s:'';}

function byId(id){return state.products.filter(function(p){return p.id===id;})[0];}

/* Datas: isoLocal gera "2026-11-25"; minDate = hoje + antecedência mínima */
function isoLocal(d){
  var m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
function minDate(){var d=new Date();d.setDate(d.getDate()+(Number(state.settings.leadDays)||0));return isoLocal(d);}
function prettyDate(iso){                                                 // "2026-11-25" -> "quarta-feira, 25/11/2026"
  var a=iso.split('-');
  return new Date(+a[0],+a[1]-1,+a[2]).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
}

/* Número do WhatsApp só com dígitos e com o código do Brasil (55) na frente */
function waDigits(){
  var d=String(state.settings.whatsapp||'').replace(/\D/g,'');
  if(d&&d.length<=11) d='55'+d;
  return d;
}

/* Carrinho: adiciona uma linha (ou soma na linha idêntica que já existe) */
function addLine(pid,title,detail,unit,qty){
  var key=[pid,title,detail,unit].join('|');
  var f=cart.filter(function(l){return l.key===key;})[0];
  if(f) f.qty+=qty;
  else cart.push({key:key,pid:pid,title:title,detail:detail,unit:unit,qty:qty});
  updateCount();
}
function cartLines(){return cart.filter(function(l){var p=byId(l.pid);return p&&p.on&&l.qty>0;});}
function cartTotal(){return cartLines().reduce(function(s,l){return s+l.unit*l.qty;},0);}
function cartCount(){return cartLines().reduce(function(s,l){return s+l.qty;},0);}

/* Escolhe o ícone pelo tipo do produto e, se for simples, pelo texto da categoria + nome */
function iconFor(p){
  if(p.kind==='fatias') return ICONS.bolo;
  if(p.kind==='opcoes') return ICONS.docinho;
  var t=((p.cat||'')+' '+(p.name||'')).toLowerCase();
  if(/cupcake|muffin/.test(t)) return ICONS.cupcake;
  if(/pote|copo|mousse/.test(t)) return ICONS.pote;
  if(/presente|caixa|kit/.test(t)) return ICONS.presente;
  if(/torta|fatia/.test(t)) return ICONS.torta;
  if(/bolo|panetone|naked/.test(t)) return ICONS.bolo;
  if(/brigadeiro|beijinho|docinho|trufa|bombom|doce/.test(t)) return ICONS.docinho;

}

/* ---------- 4.6 Calculadora de fatias (bolos decorados) ----------
   A tabela de preços fica em p.tiers: [{n:25, price:185}, ...].
   A calculadora procura o menor bolo da tabela que serve a quantidade pedida. */

/* Tabela ordenada da menor para a maior, ignorando linhas incompletas */
function sortedTiers(p){
  return (p.tiers||[]).map(function(t){return {n:Math.round(Number(t.n)),price:Number(t.price)};})
    .filter(function(t){return t.n>0&&isFinite(t.price)&&t.price>=0;})
    .sort(function(a,b){return a.n-b.n;});
}

/* Sugere o bolo para n fatias.
   - n dentro da tabela: o bolo da tabela com fatias >= n (up) e o bolo logo abaixo (low)
   - n maior que o maior bolo: combinação de bolos mais barata que cobre n fatias */
function suggest(n,tiers){
  if(!tiers.length||!(n>0)) return null;
  var max=tiers[tiers.length-1].n,min=tiers[0].n;
  if(n<=max){
    var up=tiers.filter(function(t){return t.n>=n;})[0];
    var low=tiers.filter(function(t){return t.n<n;}).pop()||null;
    return {kind:'single',up:up,low:low,under:n<min};
  }
  if(n>MAXCALC) return {kind:'toomany'};
  var best=[0],pick=[null],i,j;
  for(i=1;i<=n;i++){                                          // menor custo para cobrir i fatias
    best[i]=Infinity;
    for(j=0;j<tiers.length;j++){
      var c=best[Math.max(0,i-tiers[j].n)]+tiers[j].price;
      if(c<best[i]){best[i]=c;pick[i]=j;}
    }
  }
  var parts={},k=n;
  while(k>0){
    var t=tiers[pick[k]];
    parts[t.n]=parts[t.n]||{t:t,q:0};
    parts[t.n].q++;
    k=Math.max(0,k-t.n);
  }
  var list=Object.keys(parts).map(function(x){return parts[x];}).sort(function(a,b){return b.t.n-a.t.n;});
  var slices=list.reduce(function(s,x){return s+x.t.n*x.q;},0);
  var bolos=list.reduce(function(s,x){return s+x.q;},0);
  return {kind:'combo',list:list,slices:slices,bolos:bolos,total:best[n]};
}

/* Card grande dos bolos: tabela de preços + calculadora + escolhas de recheio */
function cakeCard(p){
  var st=ui[p.id]=ui[p.id]||{n:'30',filling:'',topping:'',note:'',pick:null};
  var fills=p.fillings||[],tops=p.toppings||[];
  if(fills.indexOf(st.filling)<0) st.filling=fills[0]||'';
  if(tops.indexOf(st.topping)<0) st.topping=tops[0]||'';
  var tiers=sortedTiers(p);
  var img=safeImg(p.img);
  var cur=null;                                                          // sugestão que está na tela
  var resBox=h('div',{class:'result','aria-live':'polite'});
  var msg=h('p',{class:'hint',role:'status'});
  var addBtn=h('button',{class:'btn',type:'button',onclick:function(){add();}},'Adicionar ao pedido');

  /* botões da tabela de preços: clicar preenche a quantidade de fatias */
  var tierBtns=tiers.map(function(t){
    var b=h('button',{class:'tier',type:'button',onclick:function(){
      st.n=String(t.n);st.pick=null;input.value=st.n;paint();
    }},h('b',null,pl(t.n,'fatia','fatias')),h('span',null,money(t.price)));
    b._n=t.n;
    return b;
  });
  var input=h('input',{type:'number',id:'fatias-'+p.id,min:'1',max:String(MAXCALC),step:'1',inputmode:'numeric',value:st.n,
    oninput:function(e){st.n=e.target.value;st.pick=null;paint();}});

  function chosen(s){return (s.low&&st.pick===s.low.n)?s.low:s.up;}     // bolo marcado (sugerido ou o menor)
  function mark(n){tierBtns.forEach(function(b){b.setAttribute('aria-pressed',String(b._n===n));});}
  function diff(sel,n){
    if(sel>n) return ' · sobram '+pl(sel-n,'fatia','fatias');
    if(sel<n) return ' · '+pl(n-sel,'fatia a menos','fatias a menos');
    return '';
  }

  /* Redesenha só o resultado (o campo de número mantém o foco) */
  function paint(){
    var n=parseInt(st.n,10),s=suggest(n,tiers);
    cur=s;msg.textContent='';resBox.textContent='';
    if(!s){
      resBox.append(h('p',{class:'muted'},'Digite quantas fatias você quer e veja o bolo e o valor sugeridos.'));
      addBtn.disabled=true;mark(null);return;
    }
    if(s.kind==='toomany'){
      resBox.append(h('p',null,'Para mais de '+MAXCALC+' fatias, combine direto com a confeiteira pelo WhatsApp.'));
      addBtn.disabled=true;mark(null);return;
    }
    addBtn.disabled=false;
    if(s.kind==='single'){
      var t=chosen(s),exact=s.up.n===n;
      mark(t.n);
      resBox.append(
        h('p',{class:'rlabel'},exact?'Bolo de '+pl(t.n,'fatia','fatias'):s.under?'O menor bolo da tabela tem '+pl(s.up.n,'fatia','fatias'):'Para '+pl(n,'fatia','fatias')+', sugerimos o bolo de '+pl(s.up.n,'fatia','fatias')),
        h('div',{class:'big'},money(t.price)),
        h('p',{class:'muted small'},'Bolo de '+pl(t.n,'fatia','fatias')+' · '+money(t.price/t.n)+' por fatia'+(s.under?'':diff(t.n,n))));
      if(!exact&&s.low){                                                  // alternativa menor, mais barata
        var alt=function(tt,label){
          return h('button',{class:'opt',type:'button','aria-pressed':String(tt===t),onclick:function(){st.pick=tt.n;paint();}},
            h('span',null,label),h('b',null,pl(tt.n,'fatia','fatias')+' · '+money(tt.price)));
        };
        resBox.append(h('div',{class:'opts',role:'group','aria-label':'Escolher o tamanho do bolo'},alt(s.up,'Sugerido'),alt(s.low,'Menor')));
      }
    }else{
      mark(null);
      var parts=s.list.map(function(x){return (x.q>1?x.q+' × ':'')+pl(x.t.n,'fatia','fatias');}).join(' + ');
      resBox.append(
        h('p',{class:'rlabel'},'Para '+pl(n,'fatia','fatias')+', sugerimos '+pl(s.bolos,'bolo','bolos')),
        h('div',{class:'big'},money(s.total)),
        h('p',{class:'muted small'},parts+' = '+pl(s.slices,'fatia','fatias')+' · '+money(s.total/s.slices)+' por fatia'+diff(s.slices,n)),
        h('p',{class:'hint'},'Valor estimado somando os bolos da tabela. A confeiteira confirma.'));
    }
  }

  /* Coloca o bolo (ou a combinação) escolhido no pedido */
  function add(){
    if(!cur||cur.kind==='toomany') return;
    var n=parseInt(st.n,10);
    var det=[];
    if(st.filling) det.push('Recheio: '+st.filling);
    if(st.topping) det.push('Cobertura: '+st.topping);
    if(st.note.trim()) det.push('Detalhes: '+st.note.trim());
    if(cur.kind==='single'){
      var t=chosen(cur),d=det.slice();
      if(t.n!==n) d.unshift('Pedido para '+pl(n,'fatia','fatias'));
      addLine(p.id,'Bolo decorado de '+pl(t.n,'fatia','fatias'),d.join('\n'),t.price,1);
    }else{
      cur.list.forEach(function(x){
        addLine(p.id,'Bolo decorado de '+pl(x.t.n,'fatia','fatias'),['Pedido para '+pl(n,'fatia','fatias')+' (combinação de bolos)'].concat(det).join('\n'),x.t.price,x.q);
      });
    }
    msg.textContent='Adicionado ao pedido. Confira na aba Agendar.';
  }

  function choice(name,list,key){                                         // grupo de botões de rádio
    return h('div',{class:'radios',role:'radiogroup','aria-label':name},list.map(function(v,i){
      return h('label',null,h('input',{type:'radio',name:key+'-'+p.id,value:v,checked:st[key]===v,onchange:function(){st[key]=v;}}),v);
    }));
  }

  var out=h('section',{class:'panel cake'},
    img?h('div',{class:'cake-photo'},h('img',{src:img,alt:p.name,loading:'lazy'})):null,
    h('div',{class:'cake-head'},
      h('div',{class:'ico',html:ICONS.bolo}),
      h('div',null,p.name!==p.cat?h('h2',null,p.name):null,p.desc?h('p',{class:'muted'},p.desc):null)),
    h('div',{class:'cake-grid'},
      h('div',{class:'cake-col'},
        h('h3',null,'Tabela de preços'),
        h('div',{class:'tiers',role:'group','aria-label':'Tabela de preços por quantidade de fatias'},tierBtns)),
      h('div',{class:'cake-col'},
        field('Quantas fatias você quer?','fatias-'+p.id,input,'Escolha na tabela ou digite o número de convidados.'),
        resBox,
        fills.length?h('div',{class:'field'},h('span',{class:'lbl'},'Recheio'),choice('Recheio',fills,'filling')):null,
        tops.length?h('div',{class:'field'},h('span',{class:'lbl'},'Cobertura'),choice('Cobertura',tops,'topping')):null,
        field('Sabor do recheio e detalhes (opcional)','nota-'+p.id,
          h('textarea',{id:'nota-'+p.id,rows:'2',oninput:function(e){st.note=e.target.value;}},st.note),
          'Ex.: mousse de maracujá, tema, texto no bolo.'),
        h('div',{class:'actions'},addBtn),msg)));
  paint();
  return out;
}

/* Brigadeiros (e outros produtos vendidos em pacotes): escolhe o pacote, a quantidade e os sabores */
function optionsCard(p){
  var st=ui[p.id]=ui[p.id]||{opt:0,packs:1,flavors:[]};
  var opts=(p.options||[]).filter(function(o){return o.label&&isFinite(Number(o.price));});
  if(st.opt>=opts.length) st.opt=0;
  var flavors=p.flavors||[];
  var totalEl=h('span',{class:'price'});
  var packsOut=h('output',{'aria-live':'polite'},String(st.packs));
  var msg=h('p',{class:'hint',role:'status'});
  function upd(){
    var o=opts[st.opt];
    totalEl.textContent=o?money(o.price*st.packs):'';
    packsOut.textContent=String(st.packs);
  }
  var list=h('div',{class:'optlist',role:'radiogroup','aria-label':'Tamanho do pedido de '+p.name},
    opts.map(function(o,i){
      return h('label',null,
        h('span',{class:'ol'},h('input',{type:'radio',name:'opt-'+p.id,checked:st.opt===i,onchange:function(){st.opt=i;upd();}}),o.label),
        h('b',null,money(o.price)));
    }));
  var stepper=h('div',{class:'stepper',role:'group','aria-label':'Quantidade de pedidos'},
    h('button',{type:'button','aria-label':'Diminuir',onclick:function(){if(st.packs>1){st.packs--;upd();}}},'−'),
    packsOut,
    h('button',{type:'button','aria-label':'Aumentar',onclick:function(){if(st.packs<20){st.packs++;upd();}}},'+'));
  var flv=flavors.length?h('div',{class:'field'},
    h('span',{class:'lbl'},'Sabores de preferência (opcional)'),
    h('div',{class:'flavors'},flavors.map(function(f){
      var name=cleanFlavor(f);
      return h('label',{class:'check'},
        h('input',{type:'checkbox',checked:st.flavors.indexOf(name)>-1,onchange:function(e){
          var i=st.flavors.indexOf(name);
          if(e.target.checked&&i<0) st.flavors.push(name);
          if(!e.target.checked&&i>-1) st.flavors.splice(i,1);
        }}),
        h('span',null,name),isNovo(f)?h('span',{class:'pill novo'},'Novo'):null);
    })),
    h('small',null,'A confeiteira confirma a combinação de sabores pelo WhatsApp.')):null;
  upd();
  return h('article',{class:'pcard'},
    media(p),
    h('div',{class:'pbody'},
      h('h3',null,p.name),
      p.desc?h('p',{class:'desc'},p.desc):null,
      list,
      h('div',{class:'field'},h('span',{class:'lbl'},'Quantidade de pedidos'),stepper),
      flv,
      h('div',{class:'pfoot'},totalEl,
        h('button',{class:'btn sm',type:'button',disabled:opts.length?null:true,onclick:function(){
          var o=opts[st.opt];
          if(!o) return;
          addLine(p.id,p.name+' — '+o.label,st.flavors.length?'Sabores: '+st.flavors.join(', '):'',o.price,st.packs);
          msg.textContent='Adicionado ao pedido. Confira na aba Agendar.';
        }},'Adicionar ao pedido')),
      msg));
}

/* Lista de categorias na ordem em que aparecem nos produtos */
function categories(list){
  var seen=[];
  list.forEach(function(p){var c=p.cat||'Outros';if(seen.indexOf(c)<0) seen.push(c);});
  return seen;
}

/* Monta uma categoria: bolos com calculadora ocupam a linha toda; o resto vai numa grade */
function section(c,items){
  var cakes=items.filter(function(p){return p.kind==='fatias';});
  var others=items.filter(function(p){return p.kind!=='fatias';});
  return h('section',{class:'sec'},
    h('h2',null,c),
    cakes.map(cakeCard),
    others.length?h('div',{class:'grid'},others.map(function(p){return p.kind==='opcoes'?optionsCard(p):simpleCard(p);})):null);
}

/* Monta a vitrine: introdução, aviso opcional, filtros e uma seção para cada categoria. */
function viewProdutos(){
  var avail=state.products.filter(function(p){return p.on;});   // só os produtos disponíveis
  var cats=categories(avail);
  if(activeCat!=='Todos'&&cats.indexOf(activeCat)<0) activeCat='Todos';
  var out=[];
  out.push(h('section',{class:'intro'},
    h('h1',null,'Doces feitos com carinho'),
    h('p',null,'Monte seu pedido de bolos e brigadeiros, agende a retirada ou a entrega e a confeiteira confirma tudo pelo WhatsApp.'),
    h('div',{class:'orn','aria-hidden':'true'},h('i'))));
  if(state.settings.notice) out.push(h('div',{class:'notice',role:'note'},state.settings.notice));
  if(ifoodLink('btn')) out.push(h('div',{class:'ifood'},h('p',null,'Prefere pedir pelo aplicativo? A AliCakes também está no iFood.'),ifoodLink('btn')));
  if(cats.length>1){                                             // botões de filtro por categoria
    out.push(h('div',{class:'chips',role:'group','aria-label':'Filtrar por categoria'},
      ['Todos'].concat(cats).map(function(c){
        return h('button',{class:'chip',type:'button','aria-pressed':String(activeCat===c),onclick:function(){activeCat=c;renderMain();}},c);
      })));
  }
  if(!avail.length){
    out.push(h('div',{class:'notice'},'Os produtos aparecem aqui assim que forem cadastrados.'));
    return out;
  }
  (activeCat==='Todos'?cats:[activeCat]).forEach(function(c){
    out.push(section(c,avail.filter(function(p){return (p.cat||'Outros')===c;})));
  });
  return out;
}

/* Confere o formulário e devolve a lista de problemas (vazia = tudo certo) */
function validate(){
  var e=[];
  if(!cartLines().length) e.push('Adicione pelo menos um produto ao pedido.');
  if(!form.name.trim()) e.push('Informe seu nome.');
  if(!form.date) e.push('Escolha a data.');
  else if(form.date<minDate()) e.push('A data precisa ter pelo menos '+state.settings.leadDays+' dia(s) de antecedência.');
  if(!form.slot) e.push('Escolha o período.');
  if(form.mode==='entrega'&&!form.address.trim()) e.push('Informe o endereço de entrega.');
  return e;
}

/* Texto da mensagem que vai para o WhatsApp da dona. Para mudar o texto,
   edite as linhas abaixo (o *texto* entre asteriscos fica em negrito no WhatsApp). */
function buildMessage(){
  var L=['Olá! Quero agendar um pedido na '+(state.settings.name||'AliCakes')+'.','',
    '*Nome:* '+form.name.trim()];
  if(form.phone.trim()) L.push('*Telefone:* '+form.phone.trim());
  L.push('*Data:* '+prettyDate(form.date)+' — '+form.slot);
  L.push('*Recebimento:* '+(form.mode==='entrega'?'Entrega em '+form.address.trim():'Retirada'));
  L.push('*Colher/talher:* '+(form.cutlery==='sim'?'Sim':'Não'));
  L.push('','*Itens:*');
  cartLines().forEach(function(l){
    L.push('• '+l.qty+'x '+l.title+' — '+money(l.unit*l.qty));
    if(l.detail) l.detail.split('\n').forEach(function(d){L.push('   '+d);});
  });
  L.push('','*Total estimado:* '+money(cartTotal()));
  if(form.notes.trim()) L.push('','*Observações:* '+form.notes.trim());
  return L.join('\n');
}

/* Reduz a foto enviada (máx. 720 px, JPEG) para o site não ficar pesado */
function compress(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'));};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej(new Error('img'));};
      img.onload=function(){
        var r=Math.min(1,720/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
        var q=0.8,u=c.toDataURL('image/jpeg',q);
        while(u.length>220000&&q>0.4){q-=0.1;u=c.toDataURL('image/jpeg',q);}     // reduz a qualidade até ficar leve
        res(u);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Editor de linhas (tabela de fatias, pacotes de brigadeiro): cada linha tem campos
   de texto. fields = [{label, get(item), set(item,valor), num}] */
function listEditor(arr,fields,blank,prefix){
  var box=h('div',{class:'rowsed'});
  arr.forEach(function(it,i){

/* Resumo de preço mostrado na linha do produto */
function priceSummary(p){
  var v=[];
  if(p.kind==='fatias') v=sortedTiers(p).map(function(t){return t.price;});
  else if(p.kind==='opcoes') v=(p.options||[]).map(function(o){return Number(o.price)||0;});
  else v=[Number(p.price)||0];
  if(!v.length) return 'sem preços';
  var a=Math.min.apply(null,v),b=Math.max.apply(null,v);
  return a===b?money(a):money(a)+' a '+money(b);
}

/* Formulário de edição de um produto (abre ao clicar em "Editar").
   Cada campo grava direto no produto (p.name, p.price...) conforme a dona digita. */
function editor(p,i,meta){

    var f=e.target.files&&e.target.files[0];

    photoMsg.textContent='Preparando foto...';
    compress(f).then(function(u){p.img=u;touch();renderMain();},function(){photoMsg.textContent='Não consegui ler essa imagem. Tente outra foto.';});
  }});
  var del=h('button',{class:'btn danger sm',type:'button',onclick:function(){            // exclusão em dois cliques
    if(armedDelete!==id){armedDelete=id;renderMain();return;}
    state.products=state.products.filter(function(x){return x.id!==id;});
    cart=cart.filter(function(l){return l.pid!==id;});
    armedDelete=null;openEditor=null;touch();renderMain();updateCount();
  }},armedDelete===id?'Confirmar exclusão':'Excluir produto');
  if(armedDelete===id) del.classList.add('armed');

  var special=[];                                                  // campos que dependem do tipo de produto
  if(p.kind==='fatias'){
    p.tiers=p.tiers||[];p.fillings=p.fillings||[];p.toppings=p.toppings||[];
    special.push(
      h('div',{class:'field'},h('span',{class:'lbl'},'Tabela de preços (fatias e valor)'),
        listEditor(p.tiers,[
          {label:'Fatias',num:true,get:function(t){return String(t.n);},set:function(t,v){t.n=parseInt(v,10)||0;}},
          {label:'Valor (R$)',num:true,get:function(t){return priceText(t.price);},set:function(t,v){t.price=parsePrice(v);meta.price();}}
        ],function(){return {n:0,price:0};},'tr-'+id)),
      linesField('Recheios','pr-'+id,p.fillings,function(a){p.fillings=a;},'Um por linha.'),
      linesField('Coberturas','pt-'+id,p.toppings,function(a){p.toppings=a;},'Um por linha.'));
  }else if(p.kind==='opcoes'){
    p.options=p.options||[];p.flavors=p.flavors||[];
    special.push(
      h('div',{class:'field'},h('span',{class:'lbl'},'Pacotes (nome e valor)'),

          {label:'Valor (R$)',num:true,get:function(o){return priceText(o.price);},set:function(o,v){o.price=parsePrice(v);meta.price();}}
        ],function(){return {label:'',price:0};},'op-'+id)),

  }else{

  }

  return h('div',{class:'aedit'},
    h('div',{class:'fields'},
      field('Nome','pn-'+id,h('input',{type:'text',id:'pn-'+id,value:p.name,oninput:function(e){p.name=e.target.value;meta.name();touch();}})),
      field('Categoria','pc-'+id,h('input',{type:'text',id:'pc-'+id,list:'cats',value:p.cat||'',oninput:function(e){p.cat=e.target.value;touch();}})),
      field('Selo (opcional)','pb-'+id,h('input',{type:'text',id:'pb-'+id,value:p.badge||'',placeholder:'Ex.: Novo, Natal',oninput:function(e){p.badge=e.target.value;touch();}}),
        'Aparece no canto da foto ou do ícone.')),
    field('Descrição','pd-'+id,h('textarea',{id:'pd-'+id,rows:'3',oninput:function(e){p.desc=e.target.value;touch();}},p.desc||'')),
    special,
    h('label',{class:'check'},h('input',{type:'checkbox',id:'po-'+id,checked:p.on,onchange:function(e){p.on=e.target.checked;meta.name();touch();}}),'Disponível na vitrine'),
    h('div',{class:'field'},h('label',{for:'pf-'+id},'Foto'),file,
      p.img?h('div',{class:'actions'},h('button',{class:'btn ghost sm',type:'button',onclick:function(){p.img='';touch();renderMain();}},'Remover foto')):null,
      photoMsg),
    h('div',{class:'actions'},del,armedDelete===id?h('button',{class:'btn ghost sm',type:'button',onclick:function(){armedDelete=null;renderMain();}},'Cancelar'):null));

/* ---------- 4.10 Salvar e publicar ----------
   Para publicar, o site monta uma cópia completa de si mesmo (HTML + CSS + JS + dados
   atualizados) e entrega à plataforma. O visual e o código são lidos das próprias
   blocos style (id="css") e script (id="app") — por isso essas duas tags precisam
   manter esses ids. */
function buildDoc(s){
  var css=document.getElementById('css').textContent;
  var app=document.getElementById('app').textContent;
  var json=JSON.stringify(s).replace(/</g,'\\u003c');            // protege o JSON dentro do HTML
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+TITULO+'</title><meta name="claude:viewport-fit-sides" content="cover">'+
    '<link rel="stylesheet" href="'+FONT_HREF+'">'+
    '<style id="css">'+css+'</style><div id="root"></div>'+
    '<'+'script type="application/json" id="state">'+json+SC+
    '<'+'script id="app">'+app+SC+'</body></html>';
}

/* Clique em "Salvar e publicar": envia a nova versão e mostra o resultado.
   Quando dá certo, a página recarrega sozinha já com os dados novos. */
function save(){
  if(saving) return;
  if(!artifactApi){saveMsg='Salvar não está disponível nesta visualização.';renderSaveBar();return;}
  var next=JSON.parse(JSON.stringify(state));
  saving=true;saveMsg='';renderSaveBar();
  artifactApi.publish(buildDoc(next)).then(function(){
    state=next;saved=JSON.stringify(state);saveMsg='Publicado. Atualizando a página...';saving=false;renderSaveBar();
  },function(e){
    saving=false;
    var c=e&&e.code;                                             // traduz o motivo da falha em mensagem
    if(c==='conflict') saveMsg='Outra versão foi publicada enquanto você editava. A página vai recarregar; refaça a alteração.';
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared') saveMsg='Esta visualização é somente de leitura. Peça permissão de edição para quem criou o site.';
    else if(c==='too_large') saveMsg='O site ficou grande demais. Troque as fotos por imagens menores ou remova algumas.';
    else if(c==='rate_limited') saveMsg='Muitas publicações seguidas. Aguarde um instante e tente de novo.';
    else saveMsg='Não foi possível publicar agora. Tente de novo.';
    renderSaveBar();
  });
}

/* Barra fixa embaixo da tela: aparece só para quem edita e só quando há algo a salvar */
function renderSaveBar(){
  var old=root.querySelector('#savebar');
  var show=canEdit&&(dirty()||saving||saveMsg);
  if(!show){if(old) old.remove();return;}
  var bar=h('div',{class:'savebar',id:'savebar',role:'region','aria-label':'Salvar alterações'},
    h('p',{role:'status'},saveMsg||(dirty()?'Alterações não publicadas.':'')),
    h('div',{class:'actions'},
      dirty()&&!saving?h('button',{class:'btn ghost sm',type:'button',onclick:function(){          // volta ao último estado publicado
        state=JSON.parse(saved);saveMsg='';armedDelete=null;ui={};render();
      }},'Descartar'):null,
      h('button',{class:'btn',type:'button',disabled:(!dirty()||saving)?true:null,onclick:save},saving?'Publicando...':'Salvar e publicar')));
  if(old) old.replaceWith(bar);else root.append(bar);
}

/* ---------- 4.11 Montagem da tela e inicialização ---------- */

/* Escolhe qual tela mostrar de acordo com a aba aberta */
function view(){
  if(tab==='agendar') return viewAgendar();
  if(tab==='painel'&&canEdit) return viewPainel();
  return viewProdutos();
}

/* Redesenha só o miolo da página (mantém barra superior e rodapé) */
function renderMain(){
  var m=root.querySelector('main');
  if(!m){render();return;}
  m.textContent='';
  [].concat(view()).forEach(function(n){m.append(n);});
}

/* Redesenha a página inteira: barra superior + miolo + rodapé + barra de salvar */
function render(){
  root.textContent='';
  root.append(header(),h('main',{class:'wrap main',id:'main'},view()),footer());
  renderSaveBar();
}

/* Início: desenha a vitrine para todo mundo e, em seguida, pergunta à plataforma
   se quem está vendo pode editar. Se puder, a aba Painel aparece. */
function init(){
  route();
  if(!root.firstChild) render();
  if(!window.claude||!window.claude.use) return;                 // fora do Claude: só vitrine e agendamento
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    artifactApi=r[1]||null;
    return r[0]?r[0].canEdit():false;
  }).then(function(ok){
    canEdit=!!ok&&!!artifactApi;
    if(canEdit){tab=(location.hash==='#painel')?'painel':tab;render();}
  }).catch(function(){});
}
init();
})();
